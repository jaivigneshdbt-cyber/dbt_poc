version: 2

sources:
  - name: ecommerce
    description: "Raw data ingested from the production e-commerce database"
    database: ECOMMERCE        # Replace with your actual database name
    schema: raw_db          # Replace with your actual schema name
    
    # Common properties applied to all tables in this source
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}
    loaded_at_field: updated_at

    tables:
      - name: customers
        description: "User profiles and contact information"
        columns:
          - name: customer_id
            tests:
              - unique
              - not_null
          - name: email
            tests:
              - not_null

      - name: products
        description: "Product catalog including pricing and stock"
        columns:
          - name: product_id
            tests:
              - unique
              - not_null
          - name: price
            tests:
              - dbt_utils.accepted_range:
                  min_value: 0
          - name: category
            tests:
              - accepted_values:
                  values: ['electronics', 'apparel', 'home', 'beauty', 'toys']

      - name: orders
        description: "Transaction records for customer purchases"
        columns:
          - name: order_id
            tests:
              - unique
              - not_null
          - name: status
            tests:
              - accepted_values:
                  values: ['placed', 'shipped', 'completed', 'returned', 'cancelled']
          - name: order_date
            tests:
              - not_null
      
      - name: events
      - name: order_items
      - name: reviews
      - name: users